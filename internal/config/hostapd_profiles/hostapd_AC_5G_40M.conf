interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=wifi-5G-AC-40M
hw_mode=a
channel=0
country_code=US

ieee80211n=1
ieee80211ac=1
ieee80211ax=0
ht_capab=[HT40-][HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=0
# 0 = 20Mhz 2.4G
# 1 = 40Mhz 2.4G
force_40mhz=1